<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - IncluEmpleo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header simplificado para el formulario -->
    <header style="justify-content: center;">
        <div class="logo">
            <h1>IncluEmpleo</h1>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>Crear una cuenta</h2>
            
            <form id="formRegistro" novalidate>
                <!-- Campo: Nombre -->
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <!-- Campo: Correo Electrónico (Faltaba) -->
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>

                <!-- Campo: Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>

                <!-- Campo: Tipo de cuenta / Rol (Faltaba) -->
                <div class="form-group">
                    <label for="rol">Tipo de cuenta:</label>
                    <select id="rol" name="rol" required style="width: 100%; padding: 0.75rem; border: 2px solid #ccc; border-radius: 4px; font-size: 1rem;">
                        <option value="">Selecciona una opción</option>
                        <option value="usuario">Busco Empleo (Usuario)</option>
                        <option value="empresa">Soy Empresa</option>
                    </select>
                </div>

                <button type="submit" class="btn">Registrarse</button>
                
                <a href="login.php" class="link-ayuda" style="margin-top: 1rem;">¿Ya tienes cuenta? Inicia sesión aquí</a>
            </form>
        </div>
    </main>

    <script>
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
        e.preventDefault();

        const datos = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            rol: document.getElementById('rol').value
        };

        try {
            const response = await fetch('api/registro.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const result = await response.json();

            if (result.status === 'ok') {
                alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
                window.location.href = 'login.php'; // Redirigir al login
            } else {
                alert('Error: ' + result.mensaje);
            }
        } catch (error) {
            console.error(error);
            alert('Error de conexión con el servidor.');
        }
    });
    </script>
</body>
</html>
