<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - IncluEmpleo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header style="justify-content: center;"><div class="logo"><h1>IncluEmpleo</h1></div></header>
    <main>
        <div class="form-container">
            <h2>Recuperar Contraseña</h2>
            <p style="text-align: center; margin-bottom: 1rem;">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
            
            <form id="formRecuperar">
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <button type="submit" class="btn">Enviar enlace</button>
                <a href="login.php" class="link-ayuda">Volver al inicio de sesión</a>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            const response = await fetch('api/recuperar.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const result = await response.json();

            if (result.status === 'ok') {
                alert('Enlace generado. Para fines de prueba, haz clic en Aceptar y serás redirigido.');
                window.location.href = result.link; 
            } else {
                alert(result.mensaje);
            }
        });
    </script>
</body>
</html>
